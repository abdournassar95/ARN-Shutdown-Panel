name: Build & Release — ARN Shutdown Panel

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (مثال: v2.0.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if (Test-Path requirements-dev.txt) { pip install -r requirements-dev.txt }
          pip install pyinstaller
          # طباعة البيئة للتشخيص
          pip list
          python --version

      - name: Verify specs
        shell: pwsh
        run: |
          if (-not (Test-Path ShutdownPanel.spec)) { throw "ShutdownPanel.spec مفقود — راجع docs" }
          if (-not (Test-Path ShutdownPanelClient.spec)) { throw "ShutdownPanelClient.spec مفقود" }
          if (-not (Test-Path assets/icon.ico)) { Write-Warning "assets/icon.ico غير موجود — سيولّد تلقائياً" }

      - name: Run tests (غير حاجب للبناء)
        id: tests
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "=== تشغيل الاختبارات — الفشل هنا لا يوقف البناء ===" -ForegroundColor Cyan
          python -m pytest -v --tb=short 2>&1 | Tee-Object -FilePath pytest.log
          $code = $LASTEXITCODE
          Write-Host "pytest exit code: $code"
          if (Test-Path pytest.log) { Get-Content pytest.log | Select-Object -Last 200 }
          # لا نرمي خطأ — البناء سيستمر، لكن نترك السجل للمراجعة
          if ($code -ne 0) { Write-Warning "بعض الاختبارات فشلت (exit $code) — سيستمر البناء وسيُرفع السجل" }

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.ref_name }}-${{ github.run_attempt }}
          path: pytest.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Build EXEs (PyInstaller)
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== بناء EXE ===" -ForegroundColor Cyan
          python build_exe.py
          if (-not (Test-Path dist/ShutdownPanel.exe)) { throw "ShutdownPanel.exe لم يُبنَ" }
          if (-not (Test-Path dist/ShutdownPanelClient.exe)) { throw "ShutdownPanelClient.exe لم يُبنَ" }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Install Inno Setup 6
        if: always()
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe غير موجود بعد التثبيت" }
          & $iscc /? | Out-Null
          Write-Host "Inno Setup جاهز: $iscc"

      - name: Build Installer
        if: always()
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "فشل بناء المثبّت" }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Generate checksums
        if: always()
        shell: pwsh
        run: |
          Set-Location dist
          if (-not (Test-Path *.exe)) { throw "لا توجد exe في dist" }
          if (Test-Path SHA256SUMS.txt) { Remove-Item SHA256SUMS.txt }
          Get-ChildItem *.exe | ForEach-Object {
            $h = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Append SHA256SUMS.txt -Encoding ascii
          }
          cat SHA256SUMS.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShutdownPanel-Windows-${{ github.ref_name }}
          path: |
            dist/ShutdownPanel.exe
            dist/ShutdownPanelClient.exe
            dist/ShutdownPanel_Setup_*.exe
            dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && github.ref_name || inputs.version || 'v2.0.1' }}
          files: |
            dist/ShutdownPanel.exe
            dist/ShutdownPanelClient.exe
            dist/ShutdownPanel_Setup_*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: false
          body_path: RELEASE_NOTES_${{ github.ref_name != '' && github.ref_name || inputs.version || 'v2.0.1' }}.md
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # إشعار نجاح البناء
  notify:
    needs: build-windows
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "### ARN Shutdown Panel — البناء التلقائي" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tag: \`${{ github.ref_name }}\` • Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "الحالة: \`${{ needs.build-windows.result }}\`" >> $GITHUB_STEP_SUMMARY
          echo "تحقق من Artifacts و Release assets بعد اكتمال البناء." >> $GITHUB_STEP_SUMMARY
